[project]
name = "proof-copilot"
version = "0.3.1"
description = "Structured Iris proof state (pcp-state) and an obligation-graph orchestrator (pcp-orch) for Rocq"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Zak Kent", email = "zkent@cs.cmu.edu" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rocq", "coq", "iris", "separation-logic", "theorem-proving", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Quality Assurance",
    "Private :: Do Not Upload",
]
dependencies = [
    # LLM4Rocq pytanque v0.2.2 (speaks coq-lsp 0.2.5 petanque). Not on PyPI: the PyPI
    # "pytanque" is an unrelated Quarkslab package, so never relax this to a version range.
    "pytanque @ git+https://github.com/LLM4Rocq/pytanque@4092b1238b56468fdc1b3d100e078791c9690fd4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
api = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/zachary-kent/proof-copilot"
Repository = "https://github.com/zachary-kent/proof-copilot"
Issues = "https://github.com/zachary-kent/proof-copilot/issues"

[project.scripts]
pcp = "pcp.cli.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pcp*"]

[tool.setuptools.package-data]
"pcp.dash" = ["*.html"]
# Read through pcp.util.assets; tests/test_install.py proves a wheel carries them.
"pcp.assets" = ["skills/*.md", "coq/*.v", "*.sh", "*.env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "rocq: requires a working Rocq/Iris toolchain (pinned switch)",
    "petanque: requires a petanque binary",
    "slow: long-running",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET", "PL"]
ignore = ["E501", "PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLR0911", "B008", "SIM108", "N818", "PLW2901", "PLC0415", "RET505", "RET504", "SIM102", "SIM105", "B007", "PLW0603", "PLR1714", "PLR0917", "SIM115", "N801"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
