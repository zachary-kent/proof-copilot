[project]
name = "proof-copilot"
version = "0.1.0"
description = "Structured Iris proof state (pcp-state) and an obligation-graph orchestrator (pcp-orch) for Rocq"
requires-python = ">=3.11"
dependencies = [
    "pytanque @ git+https://github.com/LLM4Rocq/pytanque",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
api = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
pcp = "pcp.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pcp*"]

[tool.setuptools.package-data]
"pcp.dash" = ["*.html"]
"pcp.core" = ["*.v"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "rocq: requires a working Rocq/Iris toolchain (pinned switch)",
    "petanque: requires a running pet-server",
    "slow: long-running",
]
