[project]
name = "proof-copilot"
version = "0.2.0"
description = "Structured Iris proof state (pcp-state) and an obligation-graph orchestrator (pcp-orch) for Rocq"
requires-python = ">=3.11"
dependencies = [
    "pytanque @ git+https://github.com/LLM4Rocq/pytanque",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
api = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
pcp = "pcp.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pcp*"]

[tool.setuptools.package-data]
"pcp.dash" = ["*.html"]
"pcp.state" = ["*.v"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "rocq: requires a working Rocq/Iris toolchain (pinned switch)",
    "petanque: requires a petanque binary",
    "slow: long-running",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET", "PL"]
ignore = ["E501", "PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLR0911", "B008", "SIM108", "N818", "PLW2901", "PLC0415", "RET505", "RET504", "SIM102", "SIM105", "B007", "PLW0603", "PLR1714", "PLR0917", "SIM115", "N801"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
